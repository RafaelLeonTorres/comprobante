# En cada pull request y en cada push a main: compila y prueba el backend y el frontend, y levanta los tres
# contenedores para comprobar que la app responde a través de nginx y que nginx pone las cabeceras de seguridad, la CSP
# y los límites de solicitudes y de tamaño, y que la API dibuja un PDF.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restaurar
        run: dotnet restore backend/Comprobante.slnx
      - name: Compilar
        run: dotnet build backend/Comprobante.slnx --no-restore
      # Las pruebas de integración levantan un PostgreSQL 18 con Testcontainers: el runner ya trae Docker.
      - name: Probar
        run: dotnet test backend/Comprobante.slnx --no-build

  frontend:
    name: Frontend (Angular 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Probar
        run: npx ng test --watch=false
      - name: Compilar
        run: npx ng build

  docker:
    name: Docker (web, api y db)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Crear .env
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
      - name: Construir y levantar
        run: docker compose up -d --build --wait
      - name: Probar la API a través de nginx
        run: |
          curl -fsS http://localhost:8081/api/health
          curl -fsS http://localhost:8081/api/catalogos | grep -q '"clave-prod-serv"'
      - name: Probar las cabeceras y los límites de nginx
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          # La app web lleva la CSP; todo lo que sirve nginx, las cabeceras de seguridad.
          curl -fsS -D web.txt -o /dev/null http://localhost:8081/
          grep -qi "^content-security-policy: .*script-src 'self'" web.txt
          grep -qi '^x-content-type-options: nosniff' web.txt
          curl -fsS -D api.txt -o /dev/null http://localhost:8081/api/health
          grep -qi '^x-content-type-options: nosniff' api.txt
          if grep -qi '^server: kestrel' api.txt; then echo 'La API no debe decir qué servidor es'; exit 1; fi
          # Un cuerpo de más de 3 MB lo corta nginx con un 413 en problem+json.
          head -c 4000000 /dev/zero > grande.bin
          estado=$(curl -s -o cuerpo.json -w '%{http_code}' -X POST -H 'Content-Type: application/xml' --data-binary @grande.bin http://localhost:8081/api/validaciones || true)
          test "$estado" = 413
          grep -q 'demasiado grande' cuerpo.json
          # Una ráfaga de solicitudes: pasado el cupo de nginx contesta 429 en problem+json, y antes de él todo sigue funcionando.
          lineas=$(curl -s --parallel --parallel-max 60 -o /dev/null -w '%{http_code} %{content_type}\n' 'http://localhost:8081/api/catalogos/?n=[1-150]')
          echo "$lineas" | tr -d '\r' | sort | uniq -c
          echo "$lineas" | tr -d '\r' | grep -qx '429 application/problem+json'
          echo "$lineas" | tr -d '\r' | grep -qx '200 application/json; charset=utf-8'
          echo 'cabeceras y límites: bien'
      - name: Probar el PDF a través de nginx
        run: |
          set -euo pipefail
          raiz="$PWD"
          cd "$(mktemp -d)"
          # El PDF lo dibuja la API a través de nginx: un XML de CFDI 4.0 da un PDF (con su tipo, su nombre y sin caché), y lo que no
          # sirve se explica con un 400 en problem+json, campo por campo.
          cp "$raiz/frontend/public/ejemplos/ingreso-valido.xml" ejemplo.xml
          curl -fsS -D pdf.txt -o factura.pdf -F 'xml=@ejemplo.xml;type=application/xml' http://localhost:8081/api/representaciones/pdf
          test "$(head -c 5 factura.pdf)" = '%PDF-'
          grep -qi '^content-type: application/pdf' pdf.txt
          grep -qi '^content-disposition: attachment; filename=' pdf.txt
          grep -qi '^cache-control: no-store' pdf.txt
          test "$(wc -c < factura.pdf)" -gt 10000
          # Un logo de más de 200 KB se rechaza con un 400 que lo explica en su campo, sin dibujar nada.
          head -c 300000 /dev/zero > logo.png
          estado=$(curl -s -o logo.json -w '%{http_code}' -F 'xml=@ejemplo.xml;type=application/xml' -F 'logo=@logo.png;type=image/png' http://localhost:8081/api/representaciones/pdf)
          test "$estado" = 400
          grep -q '"logo"' logo.json
          # Lo que no es un CFDI 4.0 también es un 400, en el campo del XML.
          echo '<a/>' > otro.xml
          estado=$(curl -s -o xml.json -w '%{http_code}' -F 'xml=@otro.xml;type=application/xml' http://localhost:8081/api/representaciones/pdf)
          test "$estado" = 400
          grep -q '"xml"' xml.json
          echo 'PDF: bien'
      - name: Ver los logs
        if: failure()
        run: docker compose logs
      - name: Bajar
        if: always()
        run: docker compose down -v
