# Sirve el build de Angular y manda /api al contenedor de la API. Así el navegador ve un solo origen y la app
# funciona igual con `npm start` (que usa proxy.conf.json) que dentro de Docker.

# Registro de accesos sin datos personales: ni IP, ni consulta, ni agente de usuario. Lo que se busca en los
# catálogos y lo que se manda a la API no queda en ningún registro.
log_format privado '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';

# Los healthchecks de Docker (el wget de BusyBox) no se registran.
map $http_user_agent $registrar {
    ~^Wget  0;
    default 1;
}

# Freno previo a los límites de la API: por IP, 20 solicitudes por segundo y una ráfaga de 60 (cargar un ejemplo hace
# unas 20 consultas de catálogo juntas). Los límites finos por tipo de operación los pone la API.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log privado if=$registrar;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/problem+json image/svg+xml;

    # Contra las conexiones lentas que mantienen ocupado al servidor.
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 15s;

    # DNS interno de Docker. Con la variable, nginx vuelve a resolver "api" cada 10 s y sigue funcionando cuando el
    # contenedor de la API se recrea con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    # Lo más grande que se envía a la API es un XML de hasta 2 MB; la API lo revisa de nuevo y contesta con su propio
    # 413. Lo demás es JSON de menos de 1 MB. Con el margen, nginx solo corta lo que no es un uso normal.
    client_max_body_size 3m;

    location ^~ /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        # Los rechazos quedan en el registro de accesos, con su 429 y sin IP; el registro de errores, que sí trae la
        # IP y la dirección completa, no los anota.
        limit_req_log_level info;

        # Los 413 y 429 que genera nginx salen como los de la API (problem+json, en español). Los de la API pasan tal cual.
        error_page 413 = @problema_413;
        error_page 429 = @problema_429;

        include /etc/nginx/snippets/cabeceras.conf;

        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # nginx es el borde: la IP del cliente es la que él ve, y lo que el cliente mande en X-Forwarded-For se descarta.
        # La API la usa para sus límites por IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location @problema_413 {
        include /etc/nginx/snippets/cabeceras.conf;
        default_type application/problem+json;
        return 413 '{"title":"El contenido es demasiado grande","status":413,"detail":"Lo que enviaste pesa más de lo que acepta la API."}';
    }

    location @problema_429 {
        include /etc/nginx/snippets/cabeceras.conf;
        add_header Retry-After "1" always;
        default_type application/problem+json;
        return 429 '{"title":"Demasiadas solicitudes","status":429,"detail":"Hiciste demasiadas solicitudes en poco tiempo. Espera un segundo e inténtalo de nuevo."}';
    }

    # Archivos con hash en el nombre (main-XXXXXXXX.js): nunca cambian, así que se guardan un año.
    location ~* "-[a-z0-9]{8,}\.(?:js|css|woff2?)$" {
        include /etc/nginx/snippets/cabeceras.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rutas de Angular: lo que no es un archivo devuelve index.html, que no se guarda en caché. Solo se lee: no hay
    # nada que enviar a estas rutas.
    location / {
        limit_except GET {
            deny all;
        }

        include /etc/nginx/snippets/cabeceras.conf;
        # La app solo carga lo que sirve ella misma. Los estilos en línea los inyectan los componentes de Angular Material.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
