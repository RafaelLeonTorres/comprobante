# Cabeceras de seguridad que se incluyen en cada `location` de nginx.conf. Hay que incluirlas en cada uno porque un
# `add_header` dentro de un `location` descarta los que vienen del `server`. `always` las manda también en los errores.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
